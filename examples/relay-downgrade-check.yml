# Copy into .github/workflows/ in your repo.
# Set a repo secret RELAY_API_KEY first (Settings → Secrets and variables → Actions).
name: relay-downgrade-check
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # let you run it manually too

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: cocodot2026/llmprobe-action@v1
        with:
          base-url: https://your-relay/v1
          api-key: ${{ secrets.RELAY_API_KEY }}
          model: your-model-id
          min-score: "70"
